name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secret GOOGLE_SERVICES_JSON_BASE64 berisi isi google-services.json
      # yang sudah di-encode base64 (lihat panduan di README.md)
      - name: Tulis google-services.json dari secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
