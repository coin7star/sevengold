name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secret GOOGLE_SERVICES_JSON_BASE64 berisi google-services.json
      # yang sudah di-encode ke Base64.
      - name: Tulis google-services.json dari secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      # Tampilkan fingerprint debug ke log GitHub Actions.
      - name: Show Debug SHA-1 and SHA-256
        run: |
          echo "=== FIREBASE DEBUG FINGERPRINTS ==="
          keytool -list -v             -alias androiddebugkey             -keystore ~/.android/debug.keystore             -storepass android             -keypass android | grep -E "SHA1:|SHA256:"
          echo "=== END FINGERPRINTS ==="

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
